openapi: 3.1.0
info:
  title: Ash Template API
  version: 2.0.0
paths:
  /api/v1/profile:
    get:
      operationId: getMyProfile
      security: [{privyAccessToken: [], privyIdentityToken: []}]
      parameters:
        - {$ref: "#/components/parameters/ExpectedSubject"}
      responses:
        "200": {$ref: "#/components/responses/Profile"}
        "401": {$ref: "#/components/responses/ProfileAuthenticationRequired"}
        "403": {$ref: "#/components/responses/ProfileForbidden"}
        "404": {$ref: "#/components/responses/ProfileNotCreated"}
        "503": {$ref: "#/components/responses/ProfileUnavailable"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
    patch:
      operationId: updateMyProfile
      security: [{privyAccessToken: [], privyIdentityToken: []}]
      parameters:
        - {$ref: "#/components/parameters/ExpectedSubject"}
        - {$ref: "#/components/parameters/ExpectedProfileId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProfileUpdate"}
      responses:
        "200": {$ref: "#/components/responses/Profile"}
        "400": {$ref: "#/components/responses/ProfileInvalidJson"}
        "401": {$ref: "#/components/responses/ProfileAuthenticationRequired"}
        "403": {$ref: "#/components/responses/ProfileForbidden"}
        "413": {$ref: "#/components/responses/ProfileRequestTooLarge"}
        "415": {$ref: "#/components/responses/ProfileJsonRequired"}
        "422": {$ref: "#/components/responses/ProfileInvalidUpdate"}
        "503": {$ref: "#/components/responses/ProfileUnavailable"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
  /api/v1/profile/sync:
    post:
      operationId: syncMyProfile
      security: [{privyAccessToken: [], privyIdentityToken: []}]
      parameters:
        - {$ref: "#/components/parameters/ExpectedSubject"}
      responses:
        "200": {$ref: "#/components/responses/Profile"}
        "401": {$ref: "#/components/responses/ProfileAuthenticationRequired"}
        "403": {$ref: "#/components/responses/ProfileForbidden"}
        "409": {$ref: "#/components/responses/ProfileEvidenceConflict"}
        "503": {$ref: "#/components/responses/ProfileUnavailable"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
  /auth/csrf:
    get:
      operationId: getBrowserCsrf
      responses:
        "200":
          description: CSRF token for browser session changes
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [csrf_token]
                properties:
                  csrf_token: {type: string, minLength: 1}
        "429":
          description: Too many new browser sessions were started from the client address
          headers:
            Retry-After: {schema: {type: string, const: "300"}}
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RecoveryError"}
              examples:
                rateLimited:
                  value: {error: {code: rate_limited, message: "Too many new sign-ins came from this address.", hint: "Wait the number of seconds in Retry-After, then try again."}}
        "409": {$ref: "#/components/responses/SessionChanged"}
  /auth/privy/failure:
    post:
      operationId: reportPrivyBrowserFailure
      security: [{csrfToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason:
                  type: string
                  enum: [bridge_startup, flow_closed, invalid_message, provider_error, request_timeout, session_exchange, unable_to_sign]
      responses:
        "204": {description: Diagnostic accepted or safely ignored}
        "403": {$ref: "#/components/responses/CsrfForbidden"}
  /auth/privy/session:
    post:
      operationId: createPrivyBrowserSession
      security: [{privyAccessToken: [], privyIdentityToken: [], csrfToken: []}]
      requestBody:
        required: false
        content:
          application/json:
            schema: {type: object, maxProperties: 0, additionalProperties: false}
      responses:
        "200": {$ref: "#/components/responses/Session"}
        "403": {$ref: "#/components/responses/CsrfForbidden"}
        "401": {$ref: "#/components/responses/PrivySessionUnauthorized"}
        "409": {$ref: "#/components/responses/SessionChanged"}
    delete:
      operationId: deletePrivyBrowserSession
      security: [{csrfToken: []}]
      responses:
        "200": {$ref: "#/components/responses/Logout"}
        "403": {$ref: "#/components/responses/CsrfForbidden"}
  /auth/session:
    get:
      operationId: getBrowserSession
      responses:
        "200": {$ref: "#/components/responses/Session"}
components:
  parameters:
    ExpectedSubject:
      name: x-privy-user-id
      in: header
      required: false
      description: If supplied, must exactly match the verified account subject; it never selects another account
      schema: {type: string, minLength: 1}
    ExpectedProfileId:
      name: x-regent-profile-id
      in: header
      required: false
      description: If supplied, must match the id of the profile being updated
      schema: {type: string, minLength: 1}
  securitySchemes:
    privyAccessToken:
      type: http
      scheme: bearer
      bearerFormat: Privy access token
    privyIdentityToken: {type: apiKey, in: header, name: privy-id-token}
    cookieSession: {type: apiKey, in: cookie, name: _ash_template_key}
    csrfToken: {type: apiKey, in: header, name: x-csrf-token}
  headers:
    RateLimitPolicy:
      description: The budget this request counted against, as "policy";q=requests;w=window seconds
      schema: {type: string}
    RateLimit:
      description: What is left of that budget, as "policy";r=remaining;t=seconds until the window resets
      schema: {type: string}
    RetryAfter:
      description: Seconds to wait before the window resets
      schema: {type: integer, minimum: 1}
  responses:
    TooManyRequests:
      description: Too many requests from this client address in the current window
      headers:
        RateLimit-Policy: {$ref: "#/components/headers/RateLimitPolicy"}
        RateLimit: {$ref: "#/components/headers/RateLimit"}
        Retry-After: {$ref: "#/components/headers/RetryAfter"}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/RecoveryError"}
          examples:
            tooManyRequests:
              value: {error: {code: too_many_requests, message: Too Many Requests, hint: "Wait the number of seconds in Retry-After, then send the request again."}}
    Session:
      description: Current browser session
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Session"
    PrivySessionUnauthorized:
      description: The Privy access and identity tokens were not both present and valid for one signed-in session
      headers:
        x-ash-provider-relogin:
          description: Present only when the access token itself could not be verified, which permits one fresh provider login
          required: false
          schema: {type: string, const: allowed}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/RecoveryError"}
          examples:
            unauthorized:
              value: {error: {code: unauthorized, message: "This sign-in couldn't be confirmed.", hint: "Sign in again."}}
    SessionChanged:
      description: This browser's session changed in another tab or ended; reload the page
      content:
        application/json:
          schema: {$ref: "#/components/schemas/RecoveryError"}
          examples:
            superseded:
              value: {error: {code: session_superseded, message: "This browser was signed in again from another tab.", hint: "Reload the page."}}
            reset:
              value: {error: {code: session_reset_required, message: "This browser's sign-in has ended.", hint: "Reload the page, then sign in again."}}
            switched:
              value: {error: {code: account_switch_required, message: "This browser was signed in to another account.", hint: "Reload the page, then sign in again."}}
    Logout:
      description: Local browser session removed
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [ok]
            properties: {ok: {type: boolean, const: true}}
    CsrfForbidden:
      description: CSRF token was absent or invalid
    Profile:
      description: The verified account's profile
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ProfileEnvelope"}
    ProfileAuthenticationRequired:
      description: Both Privy credentials were not present and valid
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ProfileError"}
          examples:
            authenticationRequired:
              value: {error: {code: authentication_required, message: "Sign in to read or change your profile.", hint: "Send the access token as a Bearer token and the identity token in privy-id-token, both from the same sign-in."}}
    ProfileForbidden:
      description: The credentials do not own this profile
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ProfileError"}
          examples:
            forbidden:
              value: {error: {code: profile_forbidden, message: "This profile belongs to another account.", hint: "Sign in as the profile's owner."}}
    ProfileNotCreated:
      description: The profile has not been created yet; POST /api/v1/profile/sync creates it
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ProfileError"}
          examples:
            notCreated:
              value: {error: {code: profile_not_created, message: "You have no profile yet.", hint: "Create it with POST /api/v1/profile/sync."}}
    ProfileInvalidJson:
      description: The request body is not valid JSON
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ProfileError"}
          examples:
            invalidJson:
              value: {error: {code: invalid_profile_json, message: "The request body is not valid JSON.", hint: "Send one JSON object."}}
    ProfileRequestTooLarge:
      description: The request body is larger than 8192 bytes
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ProfileError"}
          examples:
            tooLarge:
              value: {error: {code: profile_request_too_large, message: "The request body is too large.", hint: "Send only display_name and wallet_address, in under 8 KB."}}
    ProfileJsonRequired:
      description: The request body is not application/json
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ProfileError"}
          examples:
            jsonRequired:
              value: {error: {code: json_required, message: "Profile changes must be sent as JSON.", hint: "Set Content-Type to application/json."}}
    ProfileInvalidUpdate:
      description: The update is invalid or the profile has not been created yet
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ProfileError"}
          examples:
            invalidUpdate:
              value: {error: {code: invalid_profile_update, message: "The profile change could not be made.", hint: "Send only display_name and wallet_address, where wallet_address is a wallet linked to your sign-in. If your profile changed, read it again first."}}
    ProfileEvidenceConflict:
      description: The presented sign-in evidence conflicts with the stored profile
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ProfileError"}
          examples:
            conflict:
              value: {error: {code: identity_evidence_conflict, message: "Your sign-in could not be matched to your profile.", hint: "Sign in again, then retry."}}
    ProfileUnavailable:
      description: Sign-in is not configured or the profile service is unavailable
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ProfileError"}
          examples:
            unconfigured:
              value: {error: {code: profile_unconfigured, message: "Profiles are not available on this site right now.", hint: "Try again later."}}
            unavailable:
              value: {error: {code: profile_unavailable, message: "Your profile could not be reached right now.", hint: "Try again in a moment."}}
  schemas:
    ProfileEnvelope:
      type: object
      additionalProperties: false
      required: [profile]
      properties:
        profile: {$ref: "#/components/schemas/Profile"}
    Profile:
      type: object
      additionalProperties: false
      required: [profile_id, verification_basis, evidence_issued_at, display_name, linked_wallets, wallet, x]
      properties:
        profile_id: {type: string, minLength: 1}
        verification_basis: {type: string, const: last_synchronized_privy_proof}
        evidence_issued_at: {type: [string, "null"], format: date-time}
        display_name: {type: [string, "null"], maxLength: 80}
        linked_wallets:
          type: array
          items: {type: string, pattern: '^0x[0-9a-fA-F]{40}$'}
        wallet:
          type: object
          additionalProperties: false
          required: [address, verified]
          properties:
            address: {type: [string, "null"], pattern: '^0x[0-9a-fA-F]{40}$'}
            verified: {type: boolean}
        x:
          type: [object, "null"]
          additionalProperties: false
          required: [username, display_name, verified, source]
          properties:
            username: {type: [string, "null"]}
            display_name: {type: [string, "null"]}
            verified: {type: boolean, const: true}
            source: {type: string, const: privy}
    ProfileUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        display_name: {type: [string, "null"], maxLength: 80}
        wallet_address: {type: [string, "null"], pattern: '^0x[0-9a-fA-F]{40}$'}
    ProfileError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, hint]
          properties:
            code:
              type: string
              enum: [authentication_required, profile_unconfigured, profile_unavailable, profile_not_created, profile_forbidden, invalid_profile_update, invalid_profile_json, profile_request_too_large, json_required, identity_evidence_conflict, method_not_allowed, not_found]
            message: {type: string}
            hint: {type: string}
    Session:
      type: object
      additionalProperties: false
      required: [authenticated, account_control]
      properties:
        authenticated: {type: boolean}
        account_control:
          type: object
          additionalProperties: false
          required: [kind, label, avatar_src]
          properties:
            kind: {type: string, enum: [sign_in, signed_in]}
            label: {type: string}
            avatar_src:
              type: [string, "null"]
              pattern: "^data:image/svg\\+xml;base64,"
    RecoveryError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, hint]
          properties:
            code: {type: string}
            message: {type: string}
            hint: {type: string}
