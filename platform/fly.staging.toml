app = "ash-template-staging"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "/app/bin/migrate"

[env]
  PORT = "4000"
  ASH_TEMPLATE_DEPLOYMENT_ROLE = "staging"

[metrics]
  port = 9091
  path = "/metrics"

[http_service]
  internal_port = 4000
  force_https = true

  # Stated, not left to Fly's default (documented as 25 connections a machine).
  # Sized for the founder's target of 1,000 to 2,000 visitors online at once, each
  # holding one connection. An agent's live feed (GET /api/v1/feed) also stays
  # open; the site caps those at 200 a machine
  # (config :ash_template, AshTemplateWeb.FeedController), so feeds can never keep
  # visitors out.
  [http_service.concurrency]
    type = "connections"
    soft_limit = 2000
    hard_limit = 2500

# BEAM release + migrations OOM at Fly's 256MB default.
[[vm]]
  memory_mb = 1024

# The check reaches the machine directly over plain HTTP. `Host: localhost` is
# the host force_ssl leaves alone (config/prod.exs), so the check reads the
# health answer instead of a redirect to HTTPS.
[[http_service.checks]]
  grace_period = "30s"
  interval = "10s"
  method = "GET"
  path = "/healthz"
  protocol = "http"
  timeout = "2s"

  [http_service.checks.headers]
    Host = "localhost"
