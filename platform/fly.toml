primary_region = "iad"

# Fly stops a machine with SIGINT unless told otherwise, and the VM answers
# SIGINT by halting at once, cutting open connections and running jobs. SIGTERM
# shuts it down in order: open connections drain and running jobs finish, well
# inside the timeout.
kill_signal = "SIGTERM"
kill_timeout = "60s"

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "/app/bin/migrate"

[env]
  PORT = "4000"
  ASH_TEMPLATE_DEPLOYMENT_ROLE = "production"

[metrics]
  port = 9091
  path = "/metrics"

[http_service]
  internal_port = 4000
  force_https = true

  # Stated, not left to Fly's default (documented as 25 connections a machine).
  # Sized for the founder's target of 1,000 to 2,000 visitors online at once, each
  # holding one connection. An agent's live feed (GET /api/v1/feed) also stays
  # open; the site caps those at 200 a machine
  # (config :ash_template, AshTemplateWeb.FeedController), so feeds can never keep
  # visitors out.
  [http_service.concurrency]
    type = "connections"
    soft_limit = 2000
    hard_limit = 2500

# Keep one web instance: request limits are counted in each machine's memory
# (AshTemplate.Accounts.RequestRateLimiter), so each machine added multiplies them.
# Machine count is managed by `fly scale count 1`; deploy with `--ha=false`.
# BEAM release + migrations OOM at Fly's 256MB default.
[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory_mb = 2048

# The check reaches the machine directly over plain HTTP. `Host: localhost` is
# the host force_ssl leaves alone (config/prod.exs), so the check reads the
# health answer instead of a redirect to HTTPS.
[[http_service.checks]]
  grace_period = "30s"
  interval = "10s"
  method = "GET"
  path = "/healthz"
  protocol = "http"
  timeout = "2s"

  [http_service.checks.headers]
    Host = "localhost"
