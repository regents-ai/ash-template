version: 1
repo: ash-template
owner: ash-template
path: ash-template/platform
owns:
  - web_app
  - web_routes
  - human_identity
  - public_api_serving
source_of_truth:
  repo_contract: repo.yaml
  http_contracts:
    - id: ash_template_api
      owner: ash-template
      path: contracts/api-contract.openapiv3.yaml
      served_copy: priv/static/api-contract.openapiv3.yaml
  cli_contracts: []
  runtime_contracts: []
  chain_contracts: []
code_map:
  - id: endpoint
    path: lib/ash_template_web/endpoint.ex
  - id: routes
    path: lib/ash_template_web/router.ex
  - id: accounts
    path: lib/ash_template/accounts.ex
domain_interfaces:
  - id: accounts
    owner: ash-template
    path: lib/ash_template/accounts.ex
acceptance_commands:
  - cwd: platform
    command: mix precommit
  - cwd: platform
    command: npm run typecheck
