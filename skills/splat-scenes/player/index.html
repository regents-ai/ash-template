<!doctype html>
<!-- The player page: the canvas the scene is painted on, the still picture over it until the first frame, and the import map that
     points the browser at the installed vgpu packages. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Splat Scene</title>
    <script type="importmap">
      {
        "imports": {
          "vgpu": "./node_modules/vgpu/dist/index.js",
          "@vgpu/core": "./node_modules/@vgpu/core/dist/index.js",
          "@vgpu/wgsl": "./node_modules/@vgpu/wgsl/dist/index.js",
          "@vgpu/wgsl/prepare": "./node_modules/@vgpu/wgsl/dist/prepare.js"
        }
      }
    </script>
    <style>
      :root {
        --page: #f6f8fa;
        --ink: #1a1f36;
        --muted: #697386;
        --edge: #e3e8ee;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --page: #0a0d14;
          --ink: #f1f4f8;
          --muted: #8792a2;
          --edge: #232a36;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        align-content: center;
        gap: 12px;
        padding: 16px;
        background: var(--page);
        color: var(--ink);
        font: 14px/1.4 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .stage {
        position: relative;
        width: min(100%, (100vh - 96px) * 1.5);
        aspect-ratio: 3 / 2;
        border: 1px solid var(--edge);
        border-radius: 12px;
        overflow: hidden;
      }
      canvas,
      img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        image-rendering: pixelated;
      }
      canvas {
        touch-action: none;
        cursor: grab;
      }
      canvas:active {
        cursor: grabbing;
      }
      [hidden] {
        display: none;
      }
      .note {
        margin: 0;
        color: var(--muted);
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main class="stage">
      <canvas aria-label="Splat scene"></canvas>
      <img src="still.png" alt="Splat scene" />
    </main>
    <p class="note">Drag or use the arrow keys to turn.</p>
    <script type="module" src="main.js"></script>
  </body>
</html>
