name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out regents-cli
        uses: actions/checkout@v4
        with:
          repository: regents-ai/regents-cli
          path: regents-cli

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: regents-cli/pnpm-lock.yaml

      - name: Install regents-cli dependencies
        working-directory: regents-cli
        run: pnpm install --frozen-lockfile

      - name: Check the command description
        run: make check-cli REGENTS_CLI=regents-cli
